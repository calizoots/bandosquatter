[package]
name = "bandosquatter"
version = "0.1.0"
edition = "2024"

[dependencies]
rusqlite = "0.37"
id3 = "1.16"
nix = { version = "0.30.1", features = ["signal", "process"]}
chrono = "0.4.41"
tower-http = { version = "0.6.6", features = ["fs"] }
tower = "0.5.2"
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.140"
r2d2 = "0.8.10"
r2d2_sqlite = "0.31"
tokio = { version = "1", features = ["full"] }
regex = "1.11.1"
reqwest = "0.12.22"
