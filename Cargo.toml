[package]
name = "bandosquatter"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.41"
nix = { version = "0.30.1", features = ["signal", "process"]}
once_cell = "1.21.3"
r2d2 = "0.8.10"
r2d2_sqlite = "0.31"
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["fs", "cors", "compression-gzip", "limit"] }
uuid = "1.18.1"
axum = { version = "0.7", features = ["multipart"] }
axum-macros = "0.5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.140"
directories = "6.0.0"
tokio = { version = "1", features = ["full"] }
rand = "0.9.2"
argon2 = { version = "0.5", features = ["std"] }
jsonwebtoken = "9.3.1"
rust-embed = "8.7.2"
mime_guess = "2.0.5"
id3 = "1.16"
image = "0.25.8"
percent-encoding = "2.3.2"
cookie = "0.18.1"
lofty = "0.22.4"